services:
  voice-api:
    build:
      context: .
      args:
        AQX_EXTRAS: ${AQX_EXTRAS:-}
    container_name: aqx-voice-engine
    env_file: [.env]
    environment:
      HF_HOME: ${HF_HOME:-/models/huggingface}
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - model-data:/models
      - voice-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  model-data:
  voice-data:
